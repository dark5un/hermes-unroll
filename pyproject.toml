[project]
name = "hermes-unroll"
version = "0.5.0"
description = "Unroll the agent loop into a reproducible Python program"
authors = [{name = "Panagiotis Xynos - hi@onlyascii.io"}]
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
live = ["openai>=1.0"]
pydantic = ["pydantic-ai>=0.1"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-q --tb=short"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]